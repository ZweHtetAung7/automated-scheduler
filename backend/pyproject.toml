[project]
name = "automatic-scheduler-backend"
version = "0.1.0"
description = "Scheduler engine and API for the Automatic Scheduler (student-athlete day planner)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
